<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивная симуляция котла с алгоритмом и без</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1></h1>
        <div class="sim-controls">
            <label for="speed-select">Скорость:</label>
            <select id="speed-select" onchange="changeSpeed(this.value)">
                <option value="1">1x</option>
                <option value="10" selected>10x</option>
                <option value="100">100x</option>
            </select>
        </div>
    </header>

    <!-- ЭКРАН 1: НАСТРОЙКИ -->
    <div id="setup-screen" class="screen active">
        <h2 style="margin-bottom: 20px; font-size: 1.1rem; color: #cbd5e1;">Параметры симуляции</h2>
        
        <div class="setup-grid">
            <div class="form-group">
                <label for="param-moisture">Влажность дров (%)</label>
                <input type="number" id="param-moisture" value="15" min="5" max="50">
            </div>

            <div class="form-group">
                <label for="param-wood">Плотность древесины (относ.)</label>
                <input type="number" id="param-wood" value="1.0" step="0.1" min="0.5" max="1.5">
            </div>

            <div class="form-group">
                <label for="param-stacking">Качество укладки</label>
                <select id="param-stacking">
                    <option value="good">Плотно (Норма)</option>
                    <option value="bad">С зазорами (Паразитный воздух)</option>
                </select>
            </div>
        </div>

        <button class="btn-primary" onclick="startSimulation(event)">Запустить симуляцию</button>
    </div>

    <!-- ЭКРАН 2: ДАШБОРД СИМУЛЯЦИИ -->
    <div id="sim-screen" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button class="btn-secondary" onclick="resetToSetup()">← Сброс и настройки</button>
        </div>

        <div class="dashboard-top">
            <!-- Видеоплеер phases -->
            <div class="video-box">
                <video id="video-drying" class="boiler-video" loop muted playsinline>
                    <source src="kotly_0.mp4" type="video/mp4">
                </video>
                <video id="video-active" class="boiler-video" loop muted playsinline>
                    <source src="kotly_1.mp4" type="video/mp4">
                </video>
                <video id="video-coals" class="boiler-video" loop muted playsinline>
                    <source src="kotly_2.mp4" type="video/mp4">
                </video>
            </div>

            <!-- Метрики -->
            <div class="metrics-panel">
                <div class="metric-card">
                    <div class="title">Экономия топлива</div>
                    <div class="value" id="m-fuel-saved">0.0 %</div>
                    <div class="subtitle">Относительно обычного котла</div>
                </div>

                <div class="metric-card">
                    <div class="title">Накопленный КПД</div>
                    <div class="value" id="m-kpd">0 %</div>
                    <div class="subtitle" id="m-kpd-diff">Обычный котел: 0% КПД</div>
                </div>

                <div class="metric-card phase-card">
                    <div class="title">Текущая фаза алгоритма</div>
                    <div id="current-phase-badge" class="badge" style="background: #1e3a8a;">Инициализация</div>
                </div>
            </div>
        </div>

        <!-- Графики -->
        <div class="charts-grid">
            <div class="chart-container">
                <canvas id="chartTemps"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="chartFuel"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="physics.js"></script>
<script src="controller.js"></script>
<script src="script.js"></script>
</body>
</html>
